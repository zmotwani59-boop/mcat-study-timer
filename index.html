<title>Zahra HQ</title>
<!--
ZAHRA HQ IMPLEMENTATION GUARDRAILS

Architecture
- Keep this app single-file HTML/CSS/JS and localStorage-based until a concrete limitation requires otherwise.
- Do NOT migrate to React/Vue/Svelte or add a build system preemptively.
- Google OAuth/API credentials must never live in client-side code; Phase 3 integrations require a minimal backend.
- Google Calendar is a read-only external display source inside HQ. HQ-owned scheduled tasks remain the only editable schedule objects.
- Gmail integration is limited to matching existing Waiting On items / meeting invites; never scan the inbox to invent open-ended tasks.

Change discipline
- Edit in place. Never regenerate the whole file for a small request.
- Before each change, create a checkpoint and review the diff.
- If an intended small change produces a disproportionately large diff, stop and reduce scope.
- Functional changes and visual-polish changes are separate passes.
- Test empty state, normal state, and busiest-realistic state before accepting a change.

Hard NO list
- Do not add new colors unless explicitly requested.
- Do not add new component types unless the requested feature requires one.
- Do not add badge counts, progress bars, gamification, timers, countdowns, or pressure language.
- Do not add new Home cards or Home shadows unless explicitly requested.
- Do not add popups for workflow suggestions.
- Do not auto-create speculative tasks from workflow/AI suggestions; suggest first, accept to create.
- Do not create duplicate editing paths for the same data; task modal is the canonical edit surface.
- Do not rename unrelated functions or refactor working sections for style/cleanliness during scoped changes.
- Do not change navigation, palette, layout system, or settings unless that is the requested task.
- Do not add a setting merely because a value could be configurable; prefer a sensible hard-coded default until proven wrong repeatedly.
- Do not place important information only in hover/tooltips.

Product invariants
- Projects are the unit of thought; Tasks are the unit of action.
- Automatic logic may update state, resolve dependencies, and unblock work. New generative work should appear as explainable suggestions, not silent tasks.
- Suggestions must have a visible reason and persistent dismissal memory.
- Home is a glance surface, not a second Calendar or dashboard.
- Date-only quick capture = due date. Time-of-day parsed = scheduled calendar block.
- Home calendar rows are read-only except the explicit low-friction reschedule shortcut; deeper edits open the task modal.
- Zahra HQ does not push calendar-event notifications.

When splitting becomes justified
- Split into a few plain files only if this file itself becomes the maintainability bottleneck. Prefer index.html + styles.css + app.js + workflow.js before considering a framework.
-->

<style>
:root{
  --bg:#F7FBFF; --bg-raised:#FFFFFF; --ink:#25384B; --ink-soft:#5E7285; --ink-faint:#93A7B8;
  --line:#DCEAF5; --line-strong:#C8DDEA;
  --accent:#5F91B8; --accent-soft:#E7F2FA;
  --sage:#A8CDB7; --clay:#E7B59D; --navy:#789BB9; --rose:#E7B2C0; --sand:#E3CCA0; --sky:#9BC9E4;
  --danger:#C96E6E; --ok:#78A98A; --waiting:#A89C87;
  --rail-bg:#EAF4FC; --rail-ink:#29445D; --rail-ink-soft:#6E8AA1; --rail-line:#D2E5F3; --rail-active:#CFE5F7;
  --radius:12px; --radius-lg:16px;
  --shadow:0 8px 24px rgba(77,119,154,.08);
  --motion:150ms; --ease:cubic-bezier(.2,.75,.25,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15141A; --bg-raised:#1E1C25; --ink:#EEECF3; --ink-soft:#ACA7BE; --ink-faint:#6F6B82;
  --line:#2C2A35; --line-strong:#393644; --accent-soft:#1D2C29;
  --rail-bg:#0F0E13; --rail-line:rgba(255,255,255,.06);
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0; letter-spacing:-0.01em;}
button{font-family:inherit; font-size:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:inherit; color:var(--ink); background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:7px 10px;}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent);}
a{color:inherit;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
#app{display:flex; height:100vh; height:100dvh; overflow:hidden;}

/* Rail */
#rail{width:212px; flex:none; background:var(--rail-bg); display:flex; flex-direction:column; padding:18px 10px;}
.brand{display:flex; align-items:center; gap:9px; padding:6px 8px 20px;}
.brand-mark{width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#8FC2E3,#B8DCEB); flex:none;}
.brand-name{font-family:'Fraunces',serif; font-size:16.5px; font-weight:500; color:var(--rail-ink);}
.nav-item{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--rail-ink-soft); border:none; background:none; width:100%; text-align:left; margin-bottom:1px; font-size:13.5px;}
.nav-item svg{width:16px; height:16px; flex:none; opacity:.85;}
.nav-item:hover{background:var(--rail-line); color:var(--rail-ink);}
.nav-item.active{background:var(--rail-active); color:var(--rail-ink); font-weight:600;}
.nav-item.active svg{opacity:1;}
.rail-foot{margin-top:auto; padding:8px; display:flex; flex-direction:column; gap:6px;}
.kbd-hint{display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:8px; border:1px solid var(--rail-line); font-size:12px; color:var(--rail-ink-soft); cursor:pointer;}
.kbd-hint:hover{border-color:var(--rail-line); color:var(--rail-ink);}
kbd{font-family:inherit; background:rgba(255,255,255,.72); border:1px solid var(--rail-line); border-radius:4px; padding:1px 5px; font-size:11px; color:var(--rail-ink-soft);}

#main{flex:1; overflow-y:auto; position:relative;}
.page{max-width:860px; margin:0 auto; padding:38px 34px 80px;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; gap:12px;}
.page-head h1{font-size:29px;}
.page-sub{color:var(--ink-faint); font-size:12.5px; margin-bottom:22px;}
.subtle{color:var(--ink-faint); font-size:12.5px;}
.section-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:26px 0 10px; font-weight:600;}
.section-label:first-child{margin-top:0;}

.btn{border:1px solid var(--line); background:var(--bg-raised); border-radius:8px; padding:7px 13px; font-weight:500; color:var(--ink);}
.btn:hover{border-color:var(--line-strong);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{opacity:.92;}
.btn-danger{color:var(--danger); border-color:var(--danger);}
.btn-sm{padding:4px 9px; font-size:12.5px; border-radius:7px;}
.icon-btn{border:none; background:none; padding:5px; border-radius:6px; color:var(--ink-faint); display:flex;}
.icon-btn:hover{background:var(--bg); color:var(--ink-soft);}
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:600; background:var(--bg); color:var(--ink-soft);}
.dot{width:7px; height:7px; border-radius:99px; flex:none;}

/* Tabs */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab{border:none; background:none; padding:9px 4px; margin-right:16px; font-size:13px; font-weight:600; color:var(--ink-faint); position:relative; top:1px;}
.tab.active{color:var(--ink); border-bottom:2px solid var(--accent);}

/* Home */
.home-date{font-size:13px; color:var(--ink-faint); margin-bottom:2px;}
.home-hero{margin-bottom:26px;}
.home-greeting{font-size:28px;}
.next-event-card{display:flex; align-items:center; gap:12px; background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:22px;}
.next-event-time{font-family:'Fraunces',serif; font-size:20px; color:var(--accent); flex:none; min-width:74px;}
.next-event-title{font-weight:600;}
.next-event-meta{color:var(--ink-faint); font-size:12.5px;}
.quick-capture{display:flex; align-items:center; gap:8px; background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:10px 12px; margin-bottom:28px;}
.quick-capture input{flex:1; border:none; padding:6px 2px; font-size:14.5px; background:transparent;}
.top-tasks{display:flex; flex-direction:column; gap:8px; margin-bottom:28px;}
.home-note-box textarea{width:100%; min-height:80px; border:1px solid var(--line); border-radius:var(--radius); padding:12px; resize:vertical; background:var(--bg-raised); font-size:13.5px;}

/* Task row */
.task-row{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:8px; background:var(--bg-raised); border:1px solid var(--line);}
.task-row.dragging{opacity:.4;}
.task-check{width:17px; height:17px; border-radius:5px; border:1.5px solid var(--line-strong); margin-top:2px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--bg-raised);}
.task-check.checked{background:var(--sage); border-color:var(--sage);}
.task-check svg{width:11px; height:11px; color:#fff; opacity:0;}
.task-check.checked svg{opacity:1;}
.task-main{flex:1; min-width:0; cursor:pointer;}
.task-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.task-title{font-size:13.8px;}
.task-title.done{color:var(--ink-faint); text-decoration:line-through;}
.task-meta-row{display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap;}
.meta-tag{font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:3px;}
.meta-tag.overdue{color:var(--danger); font-weight:600;}
.meta-tag.today{color:var(--clay); font-weight:600;}
.meta-tag.waiting{color:var(--waiting);}
.meta-tag.snoozed{color:var(--sky);}
.meta-tag.attention{color:var(--danger); font-weight:700;}
.importance-flag{display:inline-flex; gap:1px;}
.importance-flag svg{width:9px; height:9px; color:var(--clay);}
.task-actions{display:flex; gap:2px;}
.drag-handle{cursor:grab; color:var(--ink-faint); opacity:0; padding-top:2px;}
.task-row:hover .drag-handle{opacity:1;}
.category-color-swatch{width:11px; height:11px; border-radius:4px; flex:none; border:1px solid rgba(0,0,0,.06);}

/* Category board (Tasks > Current) */
.cat-board{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.cat-card{background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;}
.cat-card-head{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line);}
.cat-card-title{font-weight:600; font-size:13.5px; flex:1;}
.cat-card-count{color:var(--ink-faint); font-size:12px;}
.cat-card-body{padding:8px; display:flex; flex-direction:column; gap:6px;}
.mini-task{display:flex; align-items:flex-start; gap:8px; padding:7px 8px; border-radius:7px; border-left:3px solid var(--cat-color,#999); background:var(--bg); cursor:pointer;}
.mini-task .t{font-size:12.5px; font-weight:600;}
.mini-task .m{font-size:11px; color:var(--ink-faint); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap;}
.more-link{font-size:11.5px; color:var(--ink-faint); padding:6px 10px; text-align:left; border:none; background:none;}
.more-link:hover{color:var(--accent);}

/* Plan */
.plan-attention-strip{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 10px;}
.attention-card{min-width:220px; flex:none; border:1px solid var(--danger); background:color-mix(in srgb, var(--danger) 8%, var(--bg-raised)); border-radius:var(--radius); padding:12px;}
.attention-card .a-title{font-size:13px; font-weight:600;}
.attention-card .a-meta{font-size:11px; color:var(--danger); margin-top:6px; font-weight:600;}
.attention-card .a-actions{display:flex; gap:6px; margin-top:10px;}
.plan-cols{display:grid; grid-template-columns:1.3fr .9fr; gap:16px;}
.plan-panel{background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:14px;}
.plan-panel h2{font-size:13.5px; margin-bottom:10px;}
.plan-panel .rows{display:flex; flex-direction:column; gap:6px;}
.metric-row{display:flex; align-items:baseline; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line);}
.metric-row:first-child{border-top:none;}
.metric-row b{font-family:'Fraunces',serif; font-size:21px;}
.metric-row span{font-size:11.5px; color:var(--ink-faint);}
.plan-empty{color:var(--ink-faint); font-size:13px; padding:10px 2px;}

/* Calendar */
.cal-wrap{border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line); background:var(--bg-raised); background-size:cover; background-position:center;}
.cal-toolbar{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.72); backdrop-filter:blur(6px); flex-wrap:wrap;}
:root[data-theme="dark"] .cal-toolbar{background:rgba(20,22,28,.72);}
.cal-toolbar h3{font-size:15.5px;}
.cal-grid{display:grid; grid-template-columns:52px repeat(7,1fr); background:rgba(255,255,255,.55);}
:root[data-theme="dark"] .cal-grid{background:rgba(20,22,28,.55);}
.cal-daylabel{padding:8px 4px; text-align:center; font-size:11px; color:var(--ink-faint); font-weight:600; border-bottom:1px solid var(--line);}
.cal-daylabel.today{color:var(--accent);}
.cal-hourlabel{font-size:10.5px; color:var(--ink-faint); text-align:right; padding-right:6px; position:relative; top:-6px;}
.cal-cell{border-left:1px solid var(--line); border-bottom:1px solid var(--line); min-height:44px; position:relative;}
.cal-event{position:absolute; left:3px; right:3px; border-radius:6px; padding:3px 7px; font-size:11px; color:#fff; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.15); cursor:pointer; line-height:1.3;}
.color-swatch-btn{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong); cursor:pointer; flex:none;}

/* Notes */
.notes-layout{display:flex; height:calc(100vh - 100px); margin:-8px -32px -60px; border-top:1px solid var(--line);}
.notes-list{width:260px; flex:none; border-right:1px solid var(--line); overflow-y:auto; padding:10px;}
.note-item{padding:10px; border-radius:8px; cursor:pointer; margin-bottom:2px;}
.note-item:hover{background:var(--bg);}
.note-item.active{background:var(--accent-soft);}
.note-item-title{font-weight:600; font-size:13.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.note-item-preview{font-size:12px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.note-editor{flex:1; padding:26px 40px; overflow-y:auto;}
.note-editor input.note-title-input{border:none; background:none; font-family:'Fraunces',serif; font-size:24px; width:100%; padding:0; margin-bottom:4px;}
.note-editor textarea{border:none; background:none; width:100%; height:calc(100% - 60px); resize:none; font-size:14.5px; line-height:1.7; padding:0;}

/* Areas */
.area-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.area-card{background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px; text-align:left; width:100%;}
.area-card-head{display:flex; align-items:center; gap:9px; margin-bottom:6px;}
.area-icon{width:10px; height:10px; border-radius:99px; flex:none;}
.area-stats{display:flex; gap:8px; margin-top:12px;}
.area-stats span{font-size:11px; font-weight:600; padding:4px 9px; border-radius:99px; background:var(--bg); color:var(--ink-soft);}

/* Inbox */
.inbox-item{display:flex; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-raised); margin-bottom:8px; align-items:flex-start;}
.inbox-item-body{flex:1; min-width:0;}
.inbox-subject{font-weight:600; font-size:13.5px; margin-bottom:3px;}
.inbox-reason{font-size:12px; color:var(--ink-faint);}
.inbox-actions{display:flex; gap:6px; flex:none;}

/* Weekly reset */
.reset-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-top:1px solid var(--line);}
.reset-row:first-child{border-top:none;}

/* Settings */
.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.setting-card{background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px;}
.setting-card h3{font-size:14px; margin-bottom:6px;}
.setting-card p{color:var(--ink-faint); font-size:12.5px; margin:0 0 12px;}
.setting-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* Command palette */
#palette-overlay{position:fixed; inset:0; background:rgba(20,22,30,.35); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding-top:12vh; z-index:100;}
#palette-overlay.open{display:flex;}
#palette{width:560px; max-width:92vw; background:var(--bg-raised); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden; border:1px solid var(--line);}
#palette-input{width:100%; border:none; border-bottom:1px solid var(--line); padding:16px 18px; font-size:16px; border-radius:0;}
#palette-input:focus{outline:none;}
#palette-results{max-height:340px; overflow-y:auto; padding:6px;}
.palette-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:13.5px;}
.palette-item.sel{background:var(--accent-soft); color:var(--accent);}
.palette-item svg{width:15px; height:15px; opacity:.7; flex:none;}
.palette-hint{font-size:11px; color:var(--ink-faint); margin-left:auto;}
.palette-empty{padding:22px; text-align:center; color:var(--ink-faint); font-size:13px;}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(20,22,30,.35); display:none; align-items:center; justify-content:center; z-index:90; padding:20px;}
.modal-overlay.open{display:flex;}
.modal{width:460px; max-width:100%; background:var(--bg-raised); border-radius:14px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:88vh; overflow-y:auto;}
.modal h3{margin-bottom:14px; font-size:18px;}
.field-row{margin-bottom:12px;}
.field-row label{font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:5px;}
.field-row input, .field-row select, .field-row textarea{width:100%;}
.field-row textarea{min-height:60px; resize:vertical;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.three-col{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.modal-actions{display:flex; justify-content:space-between; margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px;}
.checkbox-row input{width:auto;}
.checklist-item-row{display:flex; align-items:center; gap:7px; margin-bottom:6px;}
.checklist-item-row input[type="checkbox"]{width:auto; flex:none;}
.checklist-item-row input[type="text"]{flex:1; padding:5px 8px; font-size:13px;}
.checklist-add-row{display:flex; gap:6px; margin-top:4px;}
.checklist-add-row input{flex:1; padding:6px 9px; font-size:13px;}
.checklist-badge{color:var(--sage); font-weight:600;}

#toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:all .2s; pointer-events:auto; z-index:200;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast-action{margin-left:10px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600;}

/* Home calendar glance — rolling 5 days + density-aware today rail */
.week-strip{display:flex;gap:7px;margin-bottom:8px;align-items:stretch;}
.week-strip-day{flex:1 1 0;}
.week-strip-day.empty-later{flex:.72 1 0;opacity:.72;}
.week-strip-day{appearance:none;width:100%;background:var(--bg-raised);border:1px solid var(--line);border-radius:11px;padding:9px 5px 8px;text-align:center;cursor:pointer;color:var(--ink);transition:border-color var(--motion) var(--ease),background var(--motion) var(--ease),transform var(--motion) var(--ease);position:relative;}
.week-strip-day:hover,.week-strip-day:focus-visible{border-color:var(--line-strong);outline:none;}
.week-strip-day:active{transform:translateY(1px);}
.week-strip-day.today{border-color:color-mix(in srgb,var(--accent) 62%,var(--line));background:var(--accent-soft);}
.week-strip-day.today::after{content:'';position:absolute;height:1px;background:var(--accent);left:28%;right:28%;bottom:5px;border-radius:2px;}
.week-strip-day.weekend .wsd-label,.week-strip-day.weekend .wsd-num{color:var(--ink-faint);}
.week-strip-day.waiting-aged{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sand) 62%,transparent);}
.wsd-label{font-size:10px;color:var(--ink-faint);font-weight:650;text-transform:uppercase;letter-spacing:.04em;}
.wsd-num{font-family:'Fraunces',serif;font-size:16px;margin-top:2px;}
.week-strip-day.today .wsd-num{font-weight:600;color:var(--ink);}
.wsd-dots{display:flex;gap:3px;justify-content:center;align-items:center;margin-top:6px;min-height:7px;}
.wsd-dot{width:5px;height:5px;border-radius:99px;flex:none;}
.wsd-more{font-size:9px;color:var(--ink-faint);margin-left:1px;}
.week-shape{font-size:11.5px;color:var(--ink-faint);margin:6px 2px 15px;}
.today-rail{display:flex;flex-direction:column;margin:0 0 20px;max-height:196px;overflow:visible;}
.today-rail-row{width:100%;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 2px;text-align:left;transition:opacity var(--motion) var(--ease),background var(--motion) var(--ease);cursor:pointer;}
.today-rail-row.waiting-human{border-left:2px solid var(--waiting);padding-left:7px;}
.today-rail-row.gcal{border-left:2px solid var(--line-strong);padding-left:7px;}
.today-rail-row:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;}
.today-rail-reschedule{opacity:0;border:0;background:none;color:var(--ink-faint);font-size:10.5px;padding:3px 0;transition:opacity var(--motion) var(--ease),color var(--motion) var(--ease);white-space:nowrap;}
.today-rail-row:hover .today-rail-reschedule,.today-rail-row:focus-within .today-rail-reschedule{opacity:1;}
.today-rail-reschedule:hover,.today-rail-reschedule:focus-visible{color:var(--accent);outline:none;}
.gcal-mark{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1px solid var(--line-strong);border-radius:4px;font-size:8px;font-weight:700;color:var(--ink-soft);line-height:1;}
.today-rail-row:first-child{border-top:0;}
.today-rail-row:hover,.today-rail-row:focus-visible{background:color-mix(in srgb,var(--bg) 74%,transparent);outline:none;}
.today-rail-row.past{opacity:.48;order:9;}
.today-rail-row.conflict{border-left:2px solid var(--danger);padding-left:7px;}
.today-rail-time{font-size:11.5px;font-weight:650;color:var(--ink-soft);white-space:nowrap;}
.today-rail-leave{display:block;font-size:9.5px;font-weight:500;color:var(--ink-faint);margin-top:1px;}
.today-rail-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.today-rail-meta{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:10.5px;color:var(--ink-faint);}
.today-tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:9.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.rail-cat-dot{width:6px;height:6px;border-radius:99px;display:inline-block;flex:none;}
.today-rail-repeat{font-size:12px;color:var(--ink-faint);}
.today-rail-more{border:0;background:none;color:var(--ink-faint);font-size:11.5px;padding:5px 2px;text-align:left;transition:color var(--motion) var(--ease);}
.today-rail-more:hover,.today-rail-more:focus-visible{color:var(--ink);outline:none;}
.today-empty{font-size:13px;color:var(--ink-soft);padding:8px 2px 18px;min-height:36px;display:flex;align-items:center;}
@media (max-width:620px){.week-strip{gap:5px}.week-strip-day.empty-later{flex:.82 1 0}.today-rail-row{grid-template-columns:62px minmax(0,1fr) auto}.today-rail-title{white-space:normal}.today-rail-reschedule{opacity:1}}

/* View toggle + Board */
.view-toggle{display:flex; gap:6px; margin-bottom:14px;}
.seg-btn{border:1px solid var(--line); background:var(--bg-raised); padding:5px 12px; font-size:12.5px; border-radius:7px; color:var(--ink-soft);}
.seg-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.filter-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.filter-chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--bg-raised); color:var(--ink-faint); padding:5px 11px; border-radius:99px; font-size:12px; font-weight:600;}
.filter-chip .dot{width:6px; height:6px;}
.filter-chip.active{color:var(--ink); border-color:var(--line-strong); background:var(--bg);}
.filter-chip:hover{border-color:var(--line-strong);}
.board{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.board-col{background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-lg); min-height:140px; display:flex; flex-direction:column;}
.board-col.dragover{border-color:var(--accent); background:var(--accent-soft);}
.board-col-head{padding:10px 12px; font-weight:600; font-size:12.5px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.board-col-body{padding:8px; display:flex; flex-direction:column; gap:6px; flex:1; min-height:60px;}
.board-card{background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:9px 10px; cursor:grab;}
.board-card:hover{border-color:var(--line-strong);}
.board-card .t{font-size:12.5px; font-weight:600;}
.board-card .m{font-size:11px; color:var(--ink-faint); margin-top:4px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
@media (max-width:820px){ .board{grid-template-columns:1fr 1fr;} }
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint);}
.empty-state svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
.empty-state p{font-size:13.5px;}


/* Projects + workflow engine */
.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.project-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;text-align:left;width:100%;}
.project-card:hover{border-color:var(--line-strong);}
.project-card-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.project-card-title{font-weight:700;font-size:14px;flex:1;}
.project-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--ink-faint);}
.project-state{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:5px;}
.project-metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.project-metrics span{font-size:11px;background:var(--bg);color:var(--ink-faint);padding:4px 8px;border-radius:99px;font-weight:600;}
.project-brief{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:14px;}
.project-brief h2{font-size:14px;margin-bottom:6px;}
.project-section{margin-top:22px;}
.workflow-strip{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:10px;padding:10px 12px;margin:10px 0 14px;font-size:12.5px;line-height:1.55;}
.workflow-strip .wf-line{display:flex;gap:7px;align-items:flex-start;margin:3px 0;}
.suggestion-card{background:var(--bg-raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:11px 12px;margin-bottom:7px;}
.suggestion-title{font-size:13px;font-weight:650;}
.suggestion-reason{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
.suggestion-actions{display:flex;gap:6px;margin-top:9px;}
.update-hq{display:flex;gap:8px;align-items:center;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:9px 10px;margin-bottom:22px;}
.update-hq select{max-width:190px;flex:none;}
.update-hq input{flex:1;border:none;background:transparent;}
.update-hq input:focus{border:none;}
.brain-wrap{margin-bottom:22px;}
.brain-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px 2px;}
.brain-help{font-size:11.5px;color:var(--ink-faint);margin:6px 2px 0;}
.activity-list{display:flex;flex-direction:column;gap:7px;}
.activity-row{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);}
.activity-row:first-child{border-top:none;}
.activity-dot{width:7px;height:7px;border-radius:99px;background:var(--accent);margin-top:6px;flex:none;}
.activity-text{font-size:12.5px;flex:1;}
.activity-date{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;}
.waiting-card{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid var(--line);border-left:3px solid var(--waiting);border-radius:9px;background:var(--bg-raised);margin-bottom:7px;}
.waiting-body{flex:1;}
.waiting-title{font-size:12.5px;font-weight:650;}
.waiting-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.project-tag{font-size:10.5px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px;}
.blocked-tag{color:var(--ink-faint);font-weight:600;}
@media (max-width:820px){.project-grid{grid-template-columns:1fr}.update-hq{align-items:stretch;flex-direction:column}.update-hq select{max-width:none;width:100%}}


/* Visual polish — quieter, editorial, less dashboard-y. Structure comes from
   spacing and fill contrast, not borders + shadows stacked on every box. */
.page{max-width:900px;}
.home-hero{margin-bottom:20px;}
.home-greeting{font-size:31px;line-height:1.12;}
.next-event-card,.task-row,.plan-panel,.setting-card,.area-card,.cat-card,.project-card,.project-brief,.waiting-card,.suggestion-card{border-color:var(--line);}
.next-event-card{border-color:color-mix(in srgb,var(--line) 70%,var(--accent) 30%);}
.section-label{letter-spacing:.08em;font-size:10.5px;}
.task-row{transition:border-color .15s ease,background .15s ease;}
.task-row:hover{border-color:var(--line-strong);background:color-mix(in srgb,var(--bg-raised) 92%,var(--bg) 8%);}
.project-card{transition:border-color .15s ease;}
.project-card:hover{border-color:color-mix(in srgb,var(--line-strong) 55%,var(--accent) 45%);}
.google-intake{display:flex;align-items:center;gap:8px;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px 12px;margin:0 0 24px;}
.google-intake .g-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;flex:none;}
.google-intake input{flex:1;border:none;background:transparent;padding:6px 2px;min-width:0;}
.google-intake input:focus{border:none;outline:none;}
.google-source-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px;}
.google-source-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:11.5px;color:var(--ink-soft);}
.google-source-chip .gdot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
.google-source-chip.connected .gdot{background:var(--ok);}
.integration-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.integration-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 15px;}
.integration-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.integration-name{font-weight:700;font-size:13px;}
.integration-status{font-size:10.5px;padding:3px 7px;border-radius:99px;background:var(--bg);color:var(--ink-faint);font-weight:650;}
.integration-card p{font-size:12px;color:var(--ink-faint);margin:0 0 10px;line-height:1.45;}
.google-help{font-size:12px;color:var(--ink-faint);margin-top:9px;}
@media (max-width:820px){.integration-grid{grid-template-columns:1fr}.google-intake{align-items:stretch;flex-direction:column}.google-intake .g-label{margin-bottom:-2px}}

#mobile-nav{display:none;}
@media (max-width:820px){
  #rail{display:none;}
  #app{flex-direction:column;}
  #main{flex:1; padding-bottom:64px;}
  .page{padding:20px 16px 40px;}
  .area-grid,.cat-board,.settings-grid,.plan-cols{grid-template-columns:1fr;}
  .notes-layout{flex-direction:column; height:auto; margin:0;}
  .notes-list{width:100%; border-right:none; border-bottom:1px solid var(--line); max-height:220px;}
  #mobile-nav{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--rail-bg); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); z-index:50; overflow-x:auto; gap:2px;}
  #mobile-nav button{flex:1; min-width:52px; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--rail-ink-soft); padding:4px 2px; font-size:9.5px;}
  #mobile-nav button.active{color:var(--rail-ink);}
  #mobile-nav svg{width:18px; height:18px;}
  .cal-grid{grid-template-columns:36px repeat(7,1fr);}
  #palette-overlay{padding-top:8vh;}
}
</style>

</div>

function computedProjectState(p){

  const ready=projectTasks(p.id).filter(t=>!t.done&&!isBlocked(t)&&!t.waitingOn&&!t.hiddenUntilReset).length;

function isStaleUndated(t){

  const touched=(t.lastTouchedAt||t.createdAt||new Date().toISOString()).slice(0,10);
  return diffDays(localISO(), touched) >= (state.staleDays||21);
}
function resetItems(){
  const cutoff = addDays(localISO(),-3);
  return sortTasks(state.tasks.filter(t=>!t.done && (t.hiddenUntilReset || isStaleUndated(t) || (t.due && t.due<=cutoff))));
}

/* =========================================================================
   THE BRAIN — horizon visibility, category inference, duplicate detection,
   free-text date/time parsing for quick capture.
   ========================================================================= */
function withinHorizon(t){
  if(t.hiddenUntilReset || isStaleUndated(t)) return false;
  const date = taskFocusDate(t);
  if(!date) return true;
  return diffDays(date, localISO()) <= (state.horizonDays||14);
}
const STOPWORDS = new Set(['the','a','an','to','for','of','and','on','in','at','by','with','my','me','i','is','are','do','does','it','this','that']);
function tokenize(s){ return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w && !STOPWORDS.has(w)); }
function titleSimilarity(a,b){
  const ta=new Set(tokenize(a)), tb=new Set(tokenize(b));
  if(!ta.size || !tb.size) return 0;
  let inter=0; ta.forEach(w=>{ if(tb.has(w)) inter++; });
  return inter / Math.min(ta.size, tb.size);
}
function findSimilarTask(title){
  let best=null, bestScore=0;
  state.tasks.filter(t=>!t.done).forEach(t=>{ const s=titleSimilarity(t.title,title); if(s>bestScore){ bestScore=s; best=t; } });
  return bestScore>=0.6 ? best : null;
}
const CATEGORY_KEYWORDS = {
  research:['aim 1','aim 2','aim 3','apha','thesis','diabetes','manuscript','cohort','rurality','sdoh','covariate'],
  gumaps:['gumaps','research fair','mentorship','pre-health','freshman rep'],
  squash:['squash','round robin','jesters','roster','campusgroups','match'],
  work:['noustarx','screening','extraction','contract','client','abstract'],
  school:['epi','physio','hsci','quiz','christian ethics','sous','lab 2','coursework','exam','class'],
  creative:['studio hq','pro tools','microphone','u87','akg','field recorder','radio show','recording'],
  personal:['bike race','errand','home','personal'],
};
function inferCategory(title){
  const low = title.toLowerCase();
  for(const [catId, words] of Object.entries(CATEGORY_KEYWORDS)){
    if(words.some(w=>low.includes(w)) && state.categories.find(c=>c.id===catId)) return catId;
  }
  return 'personal';
}
function parseCaptureDate(text){
  const low = text.toLowerCase();
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  let due=null, cleaned=text;
  if(/\btoday\b/.test(low)){ due=localISO(); cleaned=cleaned.replace(/\btoday\b/i,'').trim(); }
  else if(/\btomorrow\b/.test(low)){ due=addDays(localISO(),1); cleaned=cleaned.replace(/\btomorrow\b/i,'').trim(); }
  else{
    for(let i=0;i<days.length;i++){
      const re = new RegExp(`\\b(?:by\\s+|on\\s+)?${days[i]}\\b`,'i');
      if(re.test(low)){ const cur=new Date().getDay(); let add=(i-cur+7)%7; if(add===0) add=7; due=addDays(localISO(),add); cleaned=cleaned.replace(re,'').trim(); break; }
    }
  }
  let time=null;
  const tm = cleaned.match(/\b(\d{1,2})(:\d{2})?\s*(am|pm)\b/i);
  if(tm){ time=parseTime(tm[0]); cleaned=cleaned.replace(tm[0],'').trim(); }
  cleaned = cleaned.replace(/\s{2,}/g,' ').replace(/^[-–,\s]+|[-–,\s]+$/g,'').trim();
  return {title: cleaned || text.trim(), due, time};
}
function smartCaptureText(raw){
  raw=(raw||'').trim(); if(!raw) return null;
  const {title, due, time} = parseCaptureDate(raw);
  const category = inferCategory(title);
  const dup = findSimilarTask(title);
  if(dup){ showDuplicateConfirm(title, dup, {due, time, category}); return null; }
  return createSmartTask(title, {due, time, category});
}
function handleQuickCapture(input){
  const raw = input.value.trim(); if(!raw) return;
  input.value='';
  smartCaptureText(raw);
}
function createSmartTask(title, parsed){
  const inferredArea = state.areas.find(a=>a.id===parsed.category) ? parsed.category : (state.areas.find(a=>a.categoryId===parsed.category)?.id || 'personal');
  const patch = {title, category:parsed.category, area:inferredArea};
  if(parsed.due && !parsed.time) patch.due = parsed.due;
  if(parsed.time){ patch.scheduled=true; patch.date = parsed.due || localISO(); patch.start = parsed.time; patch.due=''; }
  const t = addTask(patch);
  const bits = [catOf(parsed.category).name];
  if(parsed.due && !parsed.time) bits.push('due '+fmtShort(parsed.due));
  if(parsed.time) bits.push('scheduled '+fmtShort(parsed.due||localISO())+' at '+parsed.time);
  toast('Added → '+bits.join(' · '), 'Edit', ()=>openTaskModal(t.id));
  render();
}
let pendingCapture = null;
function showDuplicateConfirm(title, existing, parsed){
  pendingCapture = {title, existingId: existing.id, parsed};
  document.getElementById('task-modal').innerHTML = `
    <h3>This looks like it might already exist</h3>
    <p class="subtle" style="margin-bottom:14px;">You have <b>${escapeHtml(existing.title)}</b> open in ${escapeHtml(catOf(existing.category).name)}. Same thing, or something new?</p>

        <button class="btn btn-sm btn-primary" onclick="confirmDuplicateNew()">Different — add new</button>
      </div>
    </div>`;
  document.getElementById('task-modal-overlay').classList.add('open');
}
function confirmDuplicateSame(){ if(pendingCapture) mergeIntoExisting(pendingCapture.existingId, pendingCapture.parsed); closeTaskModal(); pendingCapture=null; }
function confirmDuplicateNew(){ if(pendingCapture) createSmartTask(pendingCapture.title, pendingCapture.parsed); closeTaskModal(); pendingCapture=null; }
function mergeIntoExisting(id, parsed){
  const patch={};
  if(parsed.due && !parsed.time) patch.due=parsed.due;
  if(parsed.time){ patch.scheduled=true; patch.date=parsed.due||localISO(); patch.start=parsed.time; patch.due=''; }

}

function addTask(partial){
  const maxOrder = Math.max(0, ...state.tasks.map(t=>t.order||0));
  const t = task(partial.title||'Untitled task', {...partial, order:maxOrder+1});
  state.tasks.push(t); save(); return t;
}
function findTaskByTitle(q){
  q = q.toLowerCase().trim();
  const open = state.tasks.filter(t=>!t.done);
  return open.find(t=>t.title.toLowerCase()===q) || open.find(t=>t.title.toLowerCase().includes(q));
}
function updateTask(id, patch){ const t=state.tasks.find(x=>x.id===id); if(t){ Object.assign(t,patch); t.lastTouchedAt=new Date().toISOString(); save(); } }
function deleteTask(id){ state.tasks = state.tasks.filter(t=>t.id!==id); save(); }
function deleteTaskWithUndo(id){
  const idx = state.tasks.findIndex(t=>t.id===id); if(idx<0) return;
  const removed = state.tasks[idx];
  state.tasks.splice(idx,1); save(); render();
  toast('Task deleted', 'Undo', ()=>{ state.tasks.splice(Math.min(idx,state.tasks.length),0,removed); save(); render(); });
}
function nextRepeatDate(dateStr, repeat){
  if(!dateStr) return '';
  if(repeat==='daily') return addDays(dateStr,1);
  if(repeat==='weekly') return addDays(dateStr,7);
  if(repeat==='monthly'){ const d=new Date(dateStr+'T12:00:00'); d.setMonth(d.getMonth()+1); return localISO(d); }
  return '';
}
function spawnNextOccurrence(t){
  if(!t.repeat || t.repeat==='none') return null;
  const nextDue = t.due ? nextRepeatDate(t.due, t.repeat) : '';
  const nextDate = (t.scheduled && t.date) ? nextRepeatDate(t.date, t.repeat) : '';
  if(!nextDue && !nextDate) return null;
  const now = new Date().toISOString();
  const maxOrder = Math.max(0, ...state.tasks.map(x=>x.order||0));
  const nt = {...t, id:uid('t'), due: nextDue || t.due, date: nextDate || t.date,
    done:false, completedAt:'', waitingOn:t.waitingOn, snoozedUntil:'',
    createdAt:now, lastTouchedAt:now, order:maxOrder+1,
    checklist:(t.checklist||[]).map(ci=>({...ci, done:false}))};
  state.tasks.push(nt); save();
  return nt;
}
function toggleDone(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const wasDone=t.done;
  if(wasDone){ updateTask(id,{done:false,completedAt:''}); render(); return; }
  const previousFeedback=state.workflowFeedback ? {...state.workflowFeedback} : null;
  updateTask(id,{done:true,completedAt:new Date().toISOString()});
  let spawned=null; if(t.repeat&&t.repeat!=='none') spawned=spawnNextOccurrence(t);
  const createdActivityIds=[], createdSuggestionIds=[];
  let effects={resolved:[],suggestions:[]}; let newly=[];
  if(t.projectId){
    effects=processProjectEvent(t.projectId,`${t.title} completed`,'completed',t.id);
    if(effects.activity) createdActivityIds.push(effects.activity.id);
    createdSuggestionIds.push(...effects.suggestions.map(s=>s.id));
    newly=resolveDependencies(t.id);
    feedbackFromEffects(t.projectId,effects,newly);
  }
  save(); render();
  toast(spawned?'Done — next occurrence added':'Marked done','Undo',()=>{
    updateTask(id,{done:false,completedAt:''});
    if(spawned) state.tasks=state.tasks.filter(x=>x.id!==spawned.id);
    if(t.projectId){ const p=projectOf(t.projectId); if(p) p.activity=(p.activity||[]).filter(a=>!createdActivityIds.includes(a.id)); state.suggestions=(state.suggestions||[]).filter(s=>!createdSuggestionIds.includes(s.id)); }
    state.workflowFeedback=previousFeedback; save(); render();
  });
}

function suggestionKey(triggerId,title){ return `${triggerId}::${tokenize(title).join('-')}`; }
function createSuggestion(partial){
  state.suggestions=state.suggestions||[];
  const triggerKey=partial.triggerKey||suggestionKey(partial.sourceType||'manual',partial.title||'');
  if(state.suggestions.some(s=>s.triggerKey===triggerKey && s.status==='dismissed')) return null;
  const dup=state.suggestions.find(s=>s.projectId===(partial.projectId||'') && s.status!=='dismissed' && (s.triggerKey===triggerKey || titleSimilarity(s.title,partial.title)>=0.5));
  if(dup){ if(partial.reason && !String(dup.reason||'').includes(partial.reason)) dup.reason=[dup.reason,partial.reason].filter(Boolean).join(' · '); return dup; }
  const s={id:uid('s'), projectId:'', title:'', reason:'', triggerKey, status:'pending', createdAt:new Date().toISOString(), resolvedAt:'', createdTaskId:'', dismissCount:0, sourceType:'rule', ...partial, triggerKey};
  state.suggestions.push(s); return s;
}
function runWorkflowTriggers(event){
  const created=[];
  WORKFLOW_TRIGGERS.filter(t=>t.match(event)).forEach(t=>t.suggest(event).forEach((x,i)=>{ const s=createSuggestion({...x,projectId:t.projectId,triggerKey:`${t.id}:${i}`,sourceType:'rule'}); if(s&&s.status==='pending') created.push(s); }));
  return created;
}
function resolveDependencies(completedTaskId){
  const newly=[];
  state.tasks.forEach(t=>{ if(!t.done && (t.blockedBy||[]).includes(completedTaskId) && !isBlocked(t)) newly.push(t); });
  return newly;

function resolveMatchingWaiting(projectId,text){
  const p=projectOf(projectId); if(!p) return [];
  const resolved=[]; const low=text.toLowerCase();
  p.waiting=(p.waiting||[]).filter(w=>{ const terms=tokenize(`${w.what} ${w.who}`); const hit=terms.some(x=>x.length>3 && low.includes(x)); if(hit && /(confirm|repl|done|finish|received|yes|ready|complete)/i.test(text)){ resolved.push(w); return false; } return true; });
  state.tasks.forEach(t=>{ if(t.projectId===projectId && t.waitingOn){ const label=waitingLabel(t.waitingOn); const hit=tokenize(label).some(x=>x.length>3 && low.includes(x)); if(hit && /(confirm|repl|done|finish|received|yes|ready|complete)/i.test(text)){ resolved.push(t.waitingOn); t.waitingOn=null; } } });
  const anyWaiting=(p.waiting||[]).length + state.tasks.filter(t=>t.projectId===projectId&&!t.done&&t.waitingOn).length; if(!anyWaiting && p.status==='waiting') p.status='active';

}
function processProjectEvent(projectId,text,type='noted',sourceTaskId=''){
  const activity=addProjectActivity(projectId,text,type,{sourceTaskId});
  const resolved=resolveMatchingWaiting(projectId,text);
  const suggestions=runWorkflowTriggers({type:'activity',text,projectId,sourceTaskId});

function feedbackFromEffects(projectId,effects,newly=[]){
  const lines=[];
  newly.forEach(t=>lines.push(`Unblocked: ${t.title}`));
  (effects.resolved||[]).forEach(w=>lines.push(`Waiting cleared: ${waitingLabel(w)}`));
  (effects.suggestions||[]).slice(0,3).forEach(s=>lines.push(`Suggested: ${s.title}`));
  if(lines.length){
    const stamp=Date.now(); state.workflowFeedback={projectId,lines,at:stamp};
    setTimeout(()=>{ if(state.workflowFeedback?.at===stamp){ state.workflowFeedback=null; save(); if(currentRoute==='projects') render(); } },4500);
  }
  return lines;
}

function recoveryTitleKey(s){ return tokenize(String(s||'').replace(/^(gumaps|epi|physio|recording arts|christian ethics|hsci\s*\d+)\s*[—:-]\s*/i,'')).join(' '); }

function inferProjectFromText(text){
  const low=String(text||'').toLowerCase();

    'gumaps-mentorship':['mentor','mentee','mentorship','when2meet','kickoff coffee'],
    'gumaps-research-fair':['research fair','pi list','principal investigator','hfsc','lab registration'],
    'squash-round-robin':['round robin','squash on fire','penn','jesters','club squash']
  };

  (state.projects||[]).forEach(p=>{

/* =========================================================================
   Natural-language command parsing (⌘K)
   ========================================================================= */
function parseNextWeekday(word){
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  word=word.toLowerCase();
  if(word==='today') return localISO();
  if(word==='tomorrow') return addDays(localISO(),1);
  const idx=days.indexOf(word); if(idx<0) return null;
  const cur=new Date().getDay(); let add=(idx-cur+7)%7; if(add===0) add=7;
  return addDays(localISO(), add);
}
function parseTime(str){
  const m=(str||'').match(/(\d{1,2})(:(\d{2}))?\s*(am|pm)?/i);
  if(!m) return '09:00';
  let h=parseInt(m[1],10); const min=m[3]?m[3]:'00'; const ap=m[4]?m[4].toLowerCase():null;
  if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0;
  if(!ap&&h<8) h+=12;
  return String(h).padStart(2,'0')+':'+min;
}
function tryParseCommand(q){
  const raw=q.trim(); let m;
  if((m=raw.match(/^done\s+(.+)$/i))) return {type:'done', title:m[1]};
  if((m=raw.match(/^schedule\s+(.+?)\s+(today|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\s*(?:at\s*)?(.*)$/i))) return {type:'schedule', title:m[1], day:m[2], time:m[3]};
  if((m=raw.match(/^due\s+(.+?)\s+(today|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/i))) return {type:'due', title:m[1], day:m[2]};
  if((m=raw.match(/^wait\s+(.+?)\s+on\s+(.+)$/i))) return {type:'wait', title:m[1], person:m[2]};
  if((m=raw.match(/^snooze\s+(.+?)\s+until\s+(today|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/i))) return {type:'snooze', title:m[1], day:m[2]};
  return null;
}
function executeCommand(cmd){
  const t = findTaskByTitle(cmd.title);
  if(!t){ toast(`No task matching "${cmd.title}"`); return; }
  if(cmd.type==='done'){ toggleDone(t.id); return; }
  if(cmd.type==='schedule'){ const d=parseNextWeekday(cmd.day); const time=parseTime(cmd.time||'9am'); updateTask(t.id,{scheduled:true, date:d, start:time}); toast(`Scheduled "${t.title}" for ${fmtShort(d)} ${time}`); }
  if(cmd.type==='due'){ const d=parseNextWeekday(cmd.day); updateTask(t.id,{due:d}); toast(`Due date set: ${t.title} → ${fmtShort(d)}`); }
  if(cmd.type==='wait'){ updateTask(t.id,{waitingOn:{id:uid('w'),what:t.title,who:cmd.person,sinceDate:localISO(),projectId:t.projectId||''}}); toast(`Waiting on ${cmd.person}: ${t.title}`); }
  if(cmd.type==='snooze'){ const d=parseNextWeekday(cmd.day); updateTask(t.id,{snoozedUntil:d}); toast(`Snoozed until ${fmtShort(d)}: ${t.title}`); }
  render();
}

function minutesOfTime(v){
  if(!v || !/^\d{1,2}:\d{2}$/.test(v)) return null;
  const [h,m]=v.split(':').map(Number); return h*60+m;
}
function travelBufferFor(t){ return Math.max(0, Number(TRAVEL_BUFFERS[t.category]||0)); }
function leaveByFor(t){ const start=minutesOfTime(t.start); const buffer=travelBufferFor(t); if(start===null||!buffer||!t.location) return ''; let m=start-buffer; if(m<0)m+=1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function inferProjectForExternal(title){
  const q=String(title||'');
  let best=null,bestScore=0;
  (state.projects||[]).forEach(p=>{ const score=Math.max(titleSimilarity(q,p.name),...projectTasks(p.id).map(t=>titleSimilarity(q,t.title))); if(score>bestScore){bestScore=score;best=p;} });
  return bestScore>=0.6 ? best.id : '';
}
function normalizeExternalCalendarEvent(e){
  const category=e.category||inferCategory(e.title||'');
  return {id:e.id||uid('gcal'),source:'gcal',title:e.title||'Untitled event',date:e.date||localISO(),start:e.start||'',end:e.end||'',allDay:!!e.allDay,location:e.location||'',externalUrl:e.externalUrl||'',category,projectId:e.projectId||inferProjectForExternal(e.title||''),updatedAt:e.updatedAt||new Date().toISOString()};
}
function calendarItemsForDate(iso){
  const local=state.tasks.filter(t=>!t.done&&t.scheduled&&t.date===iso).map(t=>({source:'hq',id:t.id,title:t.title,date:t.date,start:t.start||'',end:t.end||'',allDay:!t.start,location:t.location||'',category:t.category||'personal',projectId:t.projectId||'',repeat:t.repeat||'none',waitingOn:t.waitingOn||null,raw:t}));
  const external=(state.externalCalendarEvents||[]).filter(e=>e.date===iso).map(e=>normalizeExternalCalendarEvent(e));
  return [...local,...external];
}
function openCalendarItem(item){

  openTaskModal(item.id);
}
function rescheduleTomorrow(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const fromDate=t.scheduled?t.date:t.due;
  const toDate=addDays(fromDate||localISO(),1);
  t.rescheduleHistory=Array.isArray(t.rescheduleHistory)?t.rescheduleHistory:[];
  t.rescheduleHistory.push({fromDate:fromDate||localISO(),toDate,at:new Date().toISOString()});
  if(t.scheduled) t.date=toDate; else t.due=toDate;
  t.lastTouchedAt=new Date().toISOString(); save(); render(); toast('Moved to tomorrow','Undo',()=>{ if(t.scheduled)t.date=fromDate;else t.due=fromDate; t.rescheduleHistory.pop();save();render(); });
}

function todayRailEntries(){
  const today=localISO();
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const entries=calendarItemsForDate(today).map(item=>{
    const start=minutesOfTime(item.start);
    let end=minutesOfTime(item.end);
    if(start!==null && end===null) end=start+60;
    if(start!==null && end!==null && end<=start) end+=1440; // belongs to start day
    return {kind:(item.allDay||start===null)?'allDay':'timed',item,start,end,past:start!==null&&end!==null&&nowMin>=end,conflict:false};
  });
  const timedOnly=entries.filter(e=>e.kind==='timed');
  for(let i=0;i<timedOnly.length;i++) for(let j=i+1;j<timedOnly.length;j++){
    const a=timedOnly[i],b=timedOnly[j];
    if(Math.max(a.start,b.start)<Math.min(a.end,b.end)){a.conflict=b.conflict=true;}
  }
  const dueOnly=state.tasks.filter(t=>!t.done&&!isSnoozed(t)&&!t.scheduled&&t.due===today).map(t=>({kind:'due',item:{source:'hq',id:t.id,title:t.title,category:t.category||'personal',projectId:t.projectId||'',location:t.location||'',repeat:t.repeat||'none',waitingOn:t.waitingOn||null,raw:t},start:null,end:null,past:false,conflict:false}));
  return [...entries.filter(e=>!e.past).sort((a,b)=>(a.start??9999)-(b.start??9999)),...dueOnly,...entries.filter(e=>e.past).sort((a,b)=>(a.start??9999)-(b.start??9999))];
}

    const waitingClass=item.waitingOn?'waiting-human':'';
    return `<div class="today-rail-row ${e.past?'past':''} ${e.conflict?'conflict':''} ${waitingClass} ${item.source==='gcal'?'gcal':''}" tabindex="0" role="button" onclick='openCalendarItem(${JSON.stringify(item).replace(/'/g,"&#39;")})' onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}" aria-label="${escapeHtml(label+': '+item.title)}">
      <div class="today-rail-time">${time}</div>

    </div>`;
  }).join('')}${entries.length>HOME_RAIL_LIMIT?`<button class="today-rail-more" onclick="openCalendarDate('${localISO()}')">+${entries.length-HOME_RAIL_LIMIT} more today</button>`:''}</div>`;

function agingWaitingCount(){
  const cutoff=addDays(localISO(),-5);
  let n=0;
  (state.projects||[]).forEach(p=>(p.waiting||[]).forEach(w=>{if(w.sinceDate&&w.sinceDate<=cutoff)n++;}));
  state.tasks.forEach(t=>{if(!t.done&&t.waitingOn&&t.waitingOn.sinceDate&&t.waitingOn.sinceDate<=cutoff&&!t.due)n++;});
  return n;
}

  if(colId==='waiting'){ t.done=false; if(!t.waitingOn) t.waitingOn={id:uid('w'),what:'Pending follow-up',who:'',sinceDate:localISO(),projectId:t.projectId||''}; }

  if(colId==='done'){ t.done=true; t.completedAt=new Date().toISOString(); if(t.repeat && t.repeat!=='none') spawned=spawnNextOccurrence(t); }
  t.lastTouchedAt = new Date().toISOString();
  save(); render();
  const labels = {todo:'Not started', waiting:'Waiting', scheduled:'Scheduled', done:'Done'};
  toast('Moved to '+(labels[colId]||colId), 'Undo', ()=>{
    Object.assign(t, prev);
    if(spawned){ state.tasks = state.tasks.filter(x=>x.id!==spawned.id); }
    save(); render();
  });
}

function saveCategoryModal(id){

function deleteCategory(id){
  const fallback = state.categories.find(c=>c.id==='personal' && c.id!==id) || state.categories.find(c=>c.id!==id);
  if(!fallback){ toast('Keep at least one category'); return; }
  state.tasks.forEach(t=>{ if(t.category===id) t.category=fallback.id; });
  state.areas.forEach(a=>{ if(a.categoryId===id) a.categoryId=fallback.id; });
  state.categories = state.categories.filter(c=>c.id!==id);
  state.boardCatFilter = (state.boardCatFilter||[]).filter(c=>c!==id);
  save(); closeTaskModal(); render(); toast(`Category deleted — tasks moved to ${fallback.name}`);

  const review = sortTasks(activeTasks().filter(isStaleUndated));

  return `

    <div class="attention-card"><div class="a-title">${escapeHtml(t.title)}</div><div class="a-meta">${escapeHtml(dueText(t)||'stale — untouched a while')}</div>
    <div class="a-actions"><button class="btn btn-sm btn-primary" onclick="openTaskModal('${t.id}')">Open</button><button class="btn btn-sm" onclick="updateTask('${t.id}',{snoozedUntil:addDays(localISO(),2)}); render(); toast('Snoozed 2 days')">Snooze</button></div></div>`).join('')}</div>` : ''}
  <div class="plan-cols">
    <div>
      <div class="plan-panel"><h2>Due in the next 7 days</h2><div class="rows">${upcoming.length?upcoming.map(t=>renderTaskRow(t)).join(''):`<div class="plan-empty">Nothing due in the next 7 days.</div>`}</div></div>
      <div class="plan-panel"><h2>Waiting on someone</h2><div class="rows">${waiting.length?waiting.map(t=>renderTaskRow(t)).join(''):`<div class="plan-empty">Nothing waiting.</div>`}</div></div>
      <div class="plan-panel"><h2>Review · untouched ${state.staleDays||21}+ days</h2><div class="rows">${review.length?review.map(t=>renderTaskRow(t)).join(''):`<div class="plan-empty">Nothing stale to review.</div>`}</div></div>
      <div class="plan-panel"><h2>Unscheduled</h2><div class="rows">${unscheduled.length?unscheduled.slice(0,8).map(t=>renderTaskRow(t)).join(''):`<div class="plan-empty">Nothing unscheduled.</div>`}</div></div>
    </div>
    <div>
      <div class="plan-panel">
        <h2>At a glance</h2>
        <div class="metric-row"><span>Needs attention</span><b>${att.length}</b></div>
        <div class="metric-row"><span>Due in 7 days</span><b>${upcoming.length}</b></div>
        <div class="metric-row"><span>Waiting</span><b>${waiting.length}</b></div>
        <div class="metric-row"><span>Review</span><b>${review.length}</b></div>
        <div class="metric-row"><span>Snoozed</span><b>${snoozed.length}</b></div>
      </div>
      <div class="plan-panel"><h2>Snoozed</h2><div class="rows">${snoozed.length?snoozed.map(t=>renderTaskRow(t)).join(''):`<div class="plan-empty">Nothing snoozed.</div>`}</div></div>
    </div>
  </div>`;
}

/* =========================================================================
   PAGE: Calendar
   ========================================================================= */
function pageCalendar(){
  const start = new Date(state.weekStart);
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
  const hours = [...Array(15)].map((_,i)=>i+7);
  const bg = state.calendarBg || {type:'color', value:'#F7F8FA'};
  const bgStyle = bg.type==='image' ? `background-image:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.1)), url('${bg.value}');` : `background-color:${bg.value};`;
  function dayEvents(day){
    const iso=localISO(day);
    return calendarItemsForDate(iso).map(item=>({title:item.title,start:item.start||'09:00',color:item.source==='gcal'?'#6B7280':catOf(item.category).color,item}));
  }
  return `
  <div class="page-head"><h1>Calendar</h1>
    <div style="display:flex; gap:6px; align-items:center;">
      <span class="subtle">Background</span>
      ${['#F7F8FA','#EAF0FA','#F3ECFA','#EAF6EE','#FBF0E4'].map(c=>`<div class="color-swatch-btn" style="background:${c}" onclick="setCalBgColor('${c}')"></div>`).join('')}
      <button class="btn btn-sm" onclick="document.getElementById('cal-img-input').click()">Image…</button>
      <input type="file" id="cal-img-input" accept="image/*" style="display:none" onchange="onCalImage(event)">
    </div>
  </div>
  <div class="cal-wrap" style="${bgStyle}">
    <div class="cal-toolbar">
      <button class="icon-btn" onclick="shiftWeek(-1)">‹</button>
      <h3>${days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString(undefined,{month:'short',day:'numeric'})}</h3>
      <button class="icon-btn" onclick="shiftWeek(1)">›</button>
      <button class="btn btn-sm" onclick="state.weekStart=mondayOf(new Date()).getTime(); render();" style="margin-left:auto;">Today</button>
      <button class="btn btn-sm btn-primary" onclick="openTaskModal(); setTimeout(()=>document.getElementById('tm-scheduled').checked=true,10)">${icon('plus',12)} Scheduled item</button>
    </div>
    <div class="cal-grid">
      <div class="cal-hourlabel"></div>
      ${days.map(d=>`<div class="cal-daylabel ${localISO(d)===localISO()?'today':''}">${d.toLocaleDateString(undefined,{weekday:'short'})} <span style="color:var(--ink-faint)">${d.getDate()}</span></div>`).join('')}
      ${hours.map(h=>`
        <div class="cal-hourlabel">${h%12||12}${h<12?'a':'p'}</div>
        ${days.map(d=>{ const evs = dayEvents(d).filter(e=>parseInt((e.start||'9').split(':')[0],10)===h);
          return `<div class="cal-cell">${evs.map(e=>`<div class="cal-event" style="top:2px; background:${e.color}" onclick='openCalendarItem(${JSON.stringify(e.item).replace(/'/g,"&#39;")})' title="${escapeHtml(e.title)}">${e.item.source==='gcal'?'<span class="gcal-mark" style="margin-right:4px;background:#fff;color:#555">G</span>':''}${escapeHtml(e.title)}</div>`).join('')}</div>`; }).join('')}
      `).join('')}
    </div>
  </div>
  <p class="subtle" style="margin-top:12px;">HQ scheduled items are editable here. Google Calendar events are read-only and open in Google Calendar. Due dates alone stay on Plan and Tasks.</p>`;
}
function shiftWeek(dir){ const d=new Date(state.weekStart); d.setDate(d.getDate()+dir*7); state.weekStart=d.getTime(); render(); }
function setCalBgColor(value){ state.calendarBg = {type:'color', value}; save(); render(); }
function onCalImage(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600/img.width, 1000/img.height);
      const c = document.createElement('canvas'); c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      state.calendarBg = {type:'image', value:c.toDataURL('image/jpeg',.82)}; save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
