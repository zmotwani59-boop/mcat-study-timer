// Frontend and backend are the same Node/Express service on Render, so use
// the page's own origin rather than a hardcoded URL. A hardcoded string here
// silently breaks the OAuth popup's postMessage origin check (and every API
// call) the moment the deployed origin differs from this literal for any
// reason (custom domain, preview URL, http vs https, etc.) — same-origin
// avoids that whole class of failure.
const ZHQ_BRIDGE_URL=window.location.origin;
const ZHQ_CONNECTION_KEY='zhq-google-connection';
function zhqBridgeAvailable(){ return true; }
function zhqConnectionCode(){ return localStorage.getItem(ZHQ_CONNECTION_KEY)||''; }
async function apiFetch(path, options={}){
  const url=path.startsWith('http')?path:`${ZHQ_BRIDGE_URL}${path}`;
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  const code=zhqConnectionCode(); if(code) headers['X-ZHQ-Connection']=code;
  const r=await fetch(url,{...options,headers});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||`Request failed (${r.status})`);
  return data;
}
async function hydrateBackendStatus(){
  try{
    const status=await apiFetch('/api/status',{headers:{}});
    const connected=!!status.connected;
    ['gcal','gmail','drive','sheets','cloud'].forEach(k=>{ if(!state.integrations[k])state.integrations[k]={connected:false,lastSyncedAt:''}; state.integrations[k].connected=connected; });
    localStorage.setItem(DB_KEY,JSON.stringify(state));
    return connected;
  }catch(e){ console.warn('Backend status unavailable',e); return false; }
}
function waitingOnPayload(){
  const items=[];
  (state.projects||[]).forEach(p=>(p.waiting||[]).forEach(w=>items.push({projectId:p.id,waitingId:w.id,who:w.who||'',what:w.what||'',sinceDate:w.sinceDate||''})));
  state.tasks.filter(t=>!t.done&&t.waitingOn).forEach(t=>items.push({projectId:t.projectId||'',taskId:t.id,waitingId:t.waitingOn.id,who:t.waitingOn.who||'',what:t.waitingOn.what||'',sinceDate:t.waitingOn.sinceDate||''}));
  return items;
}
let zhqAuthPopup=null, zhqAuthPopupTimer=null, zhqAuthPending=false;
async function connectIntegration(kind){
  localStorage.setItem('zhq-google-connect-kind',kind||'all');
  const popup=window.open(`${ZHQ_BRIDGE_URL}/auth/google`,'zhq-google-auth','width=560,height=720');
  if(!popup){ toast('Allow popups to connect Google, then try again'); return; }
  zhqAuthPopup=popup; zhqAuthPending=true;
  toast('Complete Google authorization in the popup');
  clearInterval(zhqAuthPopupTimer);
  zhqAuthPopupTimer=setInterval(()=>{
    if(!zhqAuthPopup||zhqAuthPopup.closed){
      clearInterval(zhqAuthPopupTimer);
      if(zhqAuthPending){ zhqAuthPending=false; toast('Google connection window was closed before finishing'); }
    }
  },500);
}
window.addEventListener('message',async(event)=>{
  if(event.origin!==ZHQ_BRIDGE_URL)return;
  if(event.data?.type!=='zhq-google-connected'||!event.data?.code)return;
  zhqAuthPending=false; clearInterval(zhqAuthPopupTimer);
  localStorage.setItem(ZHQ_CONNECTION_KEY,event.data.code);
  await hydrateBackendStatus(); render();
  await syncCloudStateOnOpen(true); await syncExternalOnOpen(true);
  toast('Google connected');
});
async function disconnectIntegration(kind){
  try{ await apiFetch('/auth/logout',{method:'POST',body:'{}'}); }catch(e){}
  localStorage.removeItem(ZHQ_CONNECTION_KEY);
  ['gcal','gmail','drive','sheets','cloud'].forEach(k=>{ if(state.integrations?.[k]){state.integrations[k].connected=false;state.integrations[k].lastSyncedAt='';} });
  state.externalCalendarEvents=[];
  save();render();toast('Google disconnected');
}
function matchEmailToWaiting(email){
  const hay=`${email?.from||''} ${email?.subject||''} ${email?.snippet||''}`.toLowerCase();
  const matches=[];
  // A single shared word used to be enough to fire a suggestion (ratio>=0.5 of a 2-word waiting item).
  // Now: a lone-term waiting item ("Lucy") still needs its one term to hit, but anything with 2+ terms
  // needs 2+ hits at a stricter ratio, so one generic overlapping word can't spawn a suggestion alone.
  const strongEnough=(tokens,hit)=> tokens.length<=1 ? hit>=1 : (hit>=2 && hit/Math.min(tokens.length,3)>=0.66);
  (state.projects||[]).forEach(p=>{ (p.waiting||[]).forEach(w=>{ const tokens=tokenize(`${w.who||''} ${w.what||''}`); const hit=tokens.filter(x=>hay.includes(x)).length; if(tokens.length && strongEnough(tokens,hit))matches.push({projectId:p.id,waitingId:w.id,score:hit}); }); });
  state.tasks.filter(t=>!t.done&&t.waitingOn).forEach(t=>{ const w=t.waitingOn; const tokens=tokenize(`${w.who||''} ${w.what||''}`); const hit=tokens.filter(x=>hay.includes(x)).length; if(tokens.length && strongEnough(tokens,hit))matches.push({projectId:t.projectId||'',taskId:t.id,waitingId:w.id,score:hit}); });
  return matches.sort((a,b)=>b.score-a.score);
}
async function syncExternalOnOpen(force=false){
  if(window.__zhqDidOpenSync&&!force)return; window.__zhqDidOpenSync=true;
  const connected=await hydrateBackendStatus(); if(!connected)return;
  try{
    if(state.integrations?.gcal?.connected){
      const start=new Date(addDays(localISO(),-1)+'T00:00:00').toISOString();
      const end=new Date(addDays(localISO(),45)+'T23:59:59').toISOString();
      const payload=await apiFetch(`/api/calendar?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,{headers:{}});
      state.externalCalendarEvents=(payload.events||[]).map(normalizeExternalCalendarEvent);
      state.integrations.gcal.lastSyncedAt=new Date().toISOString();
    }
    let createdReal=false;
    if(state.integrations?.gmail?.connected && waitingOnPayload().length){
      const payload=await apiFetch('/api/waiting-email-matches',{method:'POST',body:JSON.stringify({waitingOn:waitingOnPayload()})});
      const before=(state.suggestions||[]).length;
      (payload.emails||[]).forEach(email=>{
        const m={projectId:email.projectId||'',taskId:email.taskId||'',waitingId:email.waitingId||''};
        if(!m.waitingId){ const fallback=matchEmailToWaiting(email)[0]; if(fallback)Object.assign(m,fallback); }
        if(!m.waitingId)return;
        createSuggestion({title:`Review reply: ${email.subject||email.from||'email'}`,reason:`A recent email from ${email.from||'someone'} may resolve something you are already waiting on.`,projectId:m.projectId||'',triggerKey:`gmail-waiting:${m.waitingId}:${email.id||email.subject||''}`,sourceType:'external',externalUrl:email.url||''});
      });
      state.integrations.gmail.lastSyncedAt=new Date().toISOString();
      createdReal=(state.suggestions||[]).length>before;
    }
    // Refreshing the Gcal cache / sync timestamps alone isn't a real content edit — only bump the
    // sync-versioning `updatedAt` (via save()) when something genuinely new (a suggestion) was created,
    // otherwise just persist quietly so opening the app doesn't make this device look "newest".
    if(createdReal) save(); else localStorage.setItem(DB_KEY, JSON.stringify(state));
    render(); if(force)toast('Google sources synced');
  }catch(e){ console.warn('Google sync skipped',e); if(force)toast('Google sync could not complete'); }
}
async function pushCloudState(){
  if(!state.integrations?.cloud?.connected)return;
  try{
    const copy=JSON.parse(JSON.stringify(state));
    const result=await apiFetch('/api/state',{method:'POST',body:JSON.stringify({state:copy})});
    if(result?.ok){ state.integrations.cloud.lastSyncedAt=new Date().toISOString(); localStorage.setItem(DB_KEY,JSON.stringify(state)); }
  }catch(e){ console.warn('Cloud save skipped',e); }
}
async function syncCloudStateOnOpen(force=false){
  const connected=await hydrateBackendStatus(); if(!connected||!state.integrations?.cloud?.connected)return;
  try{
    const remote=await apiFetch('/api/state',{headers:{}});
    if(remote?.state){
      const remoteState=normalizeState(remote.state);
      const localTime=Date.parse(state.updatedAt||0)||0, remoteTime=Date.parse(remoteState.updatedAt||0)||0;
      if(remoteTime>localTime){ state=remoteState; localStorage.setItem(DB_KEY,JSON.stringify(state)); render(); if(force)toast('Loaded newer Google-synced HQ state'); }
      else if(localTime>remoteTime){ await pushCloudState(); if(force)toast('Saved current HQ state to Google'); }
      else if(force)toast('HQ state is already in sync');
    } else { await pushCloudState(); if(force)toast('Google-backed HQ state created'); }
  }catch(e){ console.warn('Cloud sync skipped',e); if(force)toast('Google state sync could not complete'); }
}
async function handleGoogleIntake(){
  const el=document.getElementById('google-intake-input');
  if(!el||!el.value.trim())return;
  const raw=el.value.trim();
  if(/^https?:\/\//i.test(raw)){
    const isSheet=/docs\.google\.com\/spreadsheets/i.test(raw);
    // Docs/Drive and Sheets links both need the same Google connection
    if(!state.integrations?.drive?.connected){
      toast('Connect Google Drive/Sheets first — see Settings','Settings',()=>navigate('settings'));
      return; // never silently fail: leave the input as-is so the user can retry after connecting
    }
    el.value='';
    try{
      const item=await apiFetch(isSheet?'/api/sheets/read':'/api/drive/read',{method:'POST',body:JSON.stringify({url:raw})});
      const body=[item?.name||'Google item',item?.url||raw,item?.preview||''].filter(Boolean).join('\n\n');
      const note={id:uid('n'),title:`${item?.type||'Google'} — ${item?.name||'Imported item'}`,body,updated:Date.now()};
      state.notes.unshift(note); save();
      if(item?.type==='Drive')state.integrations.drive.lastSyncedAt=new Date().toISOString();
      if(item?.type==='Sheets')state.integrations.sheets.lastSyncedAt=new Date().toISOString();
      toast(`${item?.type||'Google'} item imported`,'View',()=>{notesActiveId=note.id;navigate('notes');}); return;
    }catch(e){ console.warn(e); toast('Could not read that Google link — check it\u2019s shared with your Google account'); }
    return;
  }
  el.value='';
  const lower=raw.toLowerCase(); let source='Google';
  if(lower.includes('mail.google.com')||lower.includes('gmail'))source='Gmail';
  else if(lower.includes('calendar.google.com')||lower.includes('calendar'))source='Calendar';
  else if(lower.includes('docs.google.com/spreadsheets')||lower.includes('sheet'))source='Sheets';
  else if(lower.includes('drive.google.com')||lower.includes('docs.google.com'))source='Drive';
  const note={id:uid('n'),title:`${source} intake`,body:raw,updated:Date.now()};
  state.notes.unshift(note); save(); toast(`${source} item captured`,'View',()=>{notesActiveId=note.id;navigate('notes');});
}
function pageGoogle(){
  return `<div class="page-head"><div><h1>Google</h1><span class="subtle">Bring in specific Google context without turning Google into another inbox.</span></div></div>
  <div class="page-sub">Calendar is read-only in HQ. Gmail only checks replies against things you already marked Waiting On. Drive and Sheets are deliberate imports only.</div>
  <div class="google-intake"><span class="g-label">Google input</span><input id="google-intake-input" placeholder="Paste a Drive / Docs / Sheets link you want to bring into HQ…" onkeydown="if(event.key==='Enter')handleGoogleIntake()"><button class="btn btn-sm btn-primary" onclick="handleGoogleIntake()">Add to HQ</button></div>
  <div class="integration-grid">
    <div class="integration-card"><div class="integration-head"><span class="integration-name">Google Drive</span><span class="integration-status">${state.integrations?.drive?.connected?'Connected':'Deliberate only'}</span></div><p>Read a specific Drive file only when you paste its link. No automatic Drive crawl.</p></div>
    <div class="integration-card"><div class="integration-head"><span class="integration-name">Google Sheets</span><span class="integration-status">${state.integrations?.sheets?.connected?'Connected':'Deliberate only'}</span></div><p>Import a specific Sheet intentionally. HQ never converts a whole Sheet into tasks automatically.</p></div>
  </div>`;
}

/* =========================================================================
   PAGE: Settings
   ========================================================================= */
function pageSettings(){
  const bridge=zhqBridgeAvailable();  return `
  <div class="page-head"><h1>Settings</h1></div>
  <div class="page-sub">${bridge?'Google bridge available. Local data remains the immediate working copy.':'Local file mode.'}</div>
  <div class="settings-grid">
    <div class="setting-card"><h3>Data</h3><p>Export a JSON backup before switching browsers or computers.</p>
      <div class="setting-actions"><button class="btn btn-sm btn-primary" onclick="exportBackup()">${icon('download',13)} Export backup</button><button class="btn btn-sm" onclick="document.getElementById('backup-input').click()">${icon('upload',13)} Restore backup</button></div></div>
    <div class="setting-card"><h3>Recovered data</h3><p>${recoverySummary()}. Adds only missing current/future tasks and projects; richer course/friend context stays archived for the next display layer.</p>
      <div class="setting-actions">${state.recoveryAppliedAt?`<span class="integration-status">Recovered</span><span class="subtle">${fmtShort(state.recoveryAppliedAt.slice(0,10))}</span>`:`<button class="btn btn-sm btn-primary" onclick="applyRecoverySnapshot()">Restore recovered data</button>`}</div></div>
    <div class="setting-card"><h3>Reset</h3><p>Restore the starter workspace. This deletes this browser's current Zahra HQ data.</p>
      <div class="setting-actions"><button class="btn btn-sm btn-danger" onclick="resetToStarter()">Reset starter data</button></div></div>
    <div class="setting-card"><h3>Focus window</h3><p>Scheduled dates and due dates further out than this stay tucked away until they're actually close.</p>
      <div class="setting-actions" style="align-items:center;"><input type="number" min="1" max="90" value="${state.horizonDays||14}" style="width:70px;" onchange="state.horizonDays=parseInt(this.value,10)||14; save(); render(); toast('Focus window updated');"><span class="subtle">days ahead</span></div></div>
    <div class="setting-card"><h3>Stale review</h3><p>Undated tasks untouched this long leave Current and move to Plan → Review instead of haunting your task list.</p>
      <div class="setting-actions" style="align-items:center;"><input type="number" min="3" max="180" value="${state.staleDays||21}" style="width:70px;" onchange="state.staleDays=parseInt(this.value,10)||21; save(); render(); toast('Stale review window updated');"><span class="subtle">days untouched</span></div></div>
    <div class="setting-card"><h3>Storage</h3><p>${state.tasks.length} tasks · ${(state.projects||[]).length} projects · ${state.notes.length} notes · ${pendingSuggestions().length} pending suggestions.</p></div>
    <div class="setting-card"><h3>Notifications</h3><p>Zahra HQ never pushes calendar-event notifications. Home's today rail is the reminder surface; edits stay in the task modal.</p></div>
    <div class="setting-card"><h3>Google Calendar</h3><p>Read-only source. Google events can appear on Home and Calendar; edits stay in Google Calendar. Sync runs on app-open only.</p><div class="setting-actions"><span class="integration-status">${state.integrations?.gcal?.connected?'Connected':'Not connected'}</span><span class="subtle">Last synced: ${state.integrations?.gcal?.lastSyncedAt?fmtShort(state.integrations.gcal.lastSyncedAt.slice(0,10)):'Never'}</span>${state.integrations?.gcal?.connected?`<button class="btn btn-sm" onclick="syncExternalOnOpen(true)">Sync now</button><button class="btn btn-sm" onclick="disconnectIntegration('gcal')">Disconnect</button>`:`<button class="btn btn-sm" onclick="connectIntegration('gcal')" ${bridge?'':'disabled'}>Connect</button>`}</div></div>
    <div class="setting-card"><h3>Gmail</h3><p>Only checks replies against existing Waiting On items. It never mines your inbox for tasks.</p><div class="setting-actions"><span class="integration-status">${state.integrations?.gmail?.connected?'Connected':'Not connected'}</span><span class="subtle">Last synced: ${state.integrations?.gmail?.lastSyncedAt?fmtShort(state.integrations.gmail.lastSyncedAt.slice(0,10)):'Never'}</span>${state.integrations?.gmail?.connected?`<button class="btn btn-sm" onclick="syncExternalOnOpen(true)">Sync now</button><button class="btn btn-sm" onclick="disconnectIntegration('gmail')">Disconnect</button>`:`<button class="btn btn-sm" onclick="connectIntegration('gmail')" ${bridge?'':'disabled'}>Connect</button>`}</div></div>
    <div class="setting-card"><h3>Google state sync</h3><p>Keeps the same Zahra HQ state across browsers/devices using one private Drive JSON file. Local storage remains the immediate working copy.</p><div class="setting-actions"><span class="integration-status">${state.integrations?.cloud?.connected?'Connected':'Not connected'}</span><span class="subtle">Last synced: ${state.integrations?.cloud?.lastSyncedAt?fmtShort(state.integrations.cloud.lastSyncedAt.slice(0,10)):'Never'}</span>${state.integrations?.cloud?.connected?`<button class="btn btn-sm" onclick="syncCloudStateOnOpen(true)">Sync now</button><button class="btn btn-sm" onclick="disconnectIntegration('cloud')">Disconnect</button>`:`<button class="btn btn-sm" onclick="connectIntegration('cloud')" ${bridge?'':'disabled'}>Connect</button>`}</div></div>
    <div class="setting-card"><h3>Drive + Sheets</h3><p>Deliberate imports only. Connecting authorizes HQ to read a link you explicitly paste into Google input.</p><div class="setting-actions"><span class="integration-status">${state.integrations?.drive?.connected&&state.integrations?.sheets?.connected?'Connected':'Not connected'}</span>${state.integrations?.drive?.connected&&state.integrations?.sheets?.connected?`<button class="btn btn-sm" onclick="disconnectIntegration('drive');disconnectIntegration('sheets')">Disconnect</button>`:`<button class="btn btn-sm" onclick="connectIntegration('drive').then(()=>connectIntegration('sheets'))" ${bridge?'':'disabled'}>Connect</button>`}</div></div>
  </div>`;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Zahra-HQ-backup-${localISO()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500); toast('Backup exported');
}
document.getElementById('backup-input').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const x = JSON.parse(r.result); if(!x || !x.tasks || !x.notes) throw new Error(); state = normalizeState(x); save(); render(); toast('Backup restored'); } catch(err){ alert('That file is not a valid Zahra HQ backup.'); } };
  r.readAsText(f);
});
function resetToStarter(){
  if(!confirm('Reset local Zahra HQ to starter data? This deletes current data in this browser.')) return;
  safeStorageRemove(DB_KEY); state = loadState(); render(); toast('Reset to starter data');
}

/* =========================================================================
   Render dispatcher
   ========================================================================= */
function render(){
  const fns = {home:pageHome, projects:pageProjects, tasks:pageTasks, plan:pagePlan, google:pageGoogle, calendar:pageCalendar, notes:pageNotes, areas:pageAreas, inbox:pageInbox, reset:pageReset, settings:pageSettings};
  const target = document.getElementById('page-content');
  if(!target) return; // DOM not ready / unexpected host page — nothing safe to do here
  try{
    target.innerHTML = (fns[currentRoute]||pageHome)();
  }catch(e){
    console.error('Zahra HQ: render failed for route', currentRoute, e);
    // A single broken page must never blank the whole app — show a minimal,
    // recoverable state instead of leaving page-content whatever it was
    // (often empty on first load).
    target.innerHTML = `<div class="empty-state"><p>This page hit a snag and couldn't display.</p>
      <button class="btn btn-sm btn-primary" onclick="currentRoute='home'; navigate('home');">Go to Home</button></div>`;
  }
  const main = document.getElementById('main'); if(main) main.scrollTop = 0;
  try{
    if(currentRoute==='home') bindHomeEvents();
    if(currentRoute==='notes') bindNotesEvents();
  }catch(e){ console.error('Zahra HQ: post-render binding failed', e); }
}

/* =========================================================================
   Theme + init
   ========================================================================= */
function toggleTheme(){ state.theme = state.theme==='dark' ? 'light' : 'dark'; applyTheme(); save(); }
function applyTheme(){
  try{
    document.documentElement.setAttribute('data-theme', state.theme==='dark'?'dark':'light');
    const label=document.getElementById('theme-label'); if(label) label.textContent = state.theme==='dark' ? 'Light mode' : 'Dark mode';
    const iconEl=document.getElementById('theme-icon'); if(iconEl) iconEl.textContent = state.theme==='dark' ? '☀' : '◐';
  }catch(e){ console.error('Zahra HQ: applyTheme failed', e); }
}

// Belt-and-suspenders: catch anything that slips past the per-function guards
// above (a bad synchronous error, an unhandled promise rejection from a
// background sync) so a failure anywhere never leaves the app blank.
window.addEventListener('error', (e)=>{ console.error('Zahra HQ: uncaught error', e.error||e.message); });
window.addEventListener('unhandledrejection', (e)=>{ console.error('Zahra HQ: unhandled rejection', e.reason); });

try{
  renderNav(); applyTheme(); render();
}catch(e){
  console.error('Zahra HQ: startup render failed', e);
  const target=document.getElementById('page-content');
  if(target) target.innerHTML = `<div class="empty-state"><p>Zahra HQ hit a startup error. Your data is safe in this browser.</p>
    <button class="btn btn-sm btn-primary" onclick="location.reload()">Reload</button></div>`;
}
// Google/backend/cloud sync are all optional to a working app — any failure
// here is caught inside each function already, so this never blocks or
// blanks the already-rendered page above.
(async()=>{
  try{
    await hydrateBackendStatus(); render();
    await syncCloudStateOnOpen(); await syncExternalOnOpen();
  }catch(e){ console.warn('Zahra HQ: background Google/cloud sync skipped', e); }
})();
</script>
